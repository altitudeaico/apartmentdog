const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:600000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function go(){
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "Unlocking\u2026";
  try{
    const html = await unlock(pw);
    try{ sessionStorage.setItem("vault-pw", pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){ err.textContent = "Wrong passphrase."; }
}
document.getElementById("go").addEventListener("click", go);
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
(async()=>{ try{ const s=sessionStorage.getItem("vault-pw"); if(s){ document.getElementById("pw").value=s; await go(); } }catch(e){} })();
</script>
